apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-event-management
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: college-event-management
  template:
    metadata:
      labels:
        app: college-event-management
    spec:
      containers:
        - name: college-event-management
          image: heyitsarsh/college-event-management:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: college-event-management-service
spec:
  type: NodePort
  selector:
    app: college-event-management
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31150
